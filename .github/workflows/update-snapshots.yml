name: Update Visual Snapshots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to update snapshots on (leave empty to use current)'
        required: false
        default: ''

concurrency:
  group: update-snapshots-${{ github.event.inputs.branch || github.ref }}
  cancel-in-progress: false

# Workflow permissions:
# - contents: write: 스냅샷 파일 변경사항을 커밋하고 브랜치에 푸시하기 위해 필요
permissions:
  contents: write

jobs:
  update-snapshots:
    name: Update Playwright Snapshots
    runs-on: ubuntu-latest

    steps:
      - name: Get Target Branch
        id: branch
        env:
          BRANCH_INPUT: ${{ github.event.inputs.branch }}
        run: |
          # 브랜치 이름 형식 검증 (영숫자, 하이픈, 슬래시, 언더스코어만 허용)
          if [ -n "$BRANCH_INPUT" ]; then
            if [[ ! "$BRANCH_INPUT" =~ ^[a-zA-Z0-9/_-]+$ ]]; then
              echo "::error::Invalid branch name format"
              exit 1
            fi
            echo "target=$BRANCH_INPUT" >> $GITHUB_OUTPUT
          else
            echo "target=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.target }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 캐시 키를 Playwright 해석 버전에 고정한다(playwright.yml과 동일 키를 공유).
      - name: Get Playwright version
        id: playwright-version
        run: |
          cd apps/portfolio
          echo "VERSION=$(node -p "require('@playwright/test/package.json').version")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.VERSION }}

      # 테스트가 쓰는 chromium·webkit만 설치한다. 캐시가 적중해도 OS 라이브러리(apt)는
      # 캐시 대상이 아니라 매번 설치해야 하며, 이 구간이 간헐적으로 정체되므로
      # playwright.yml과 동일하게 5분 타임아웃 × 3회 재시도로 감싼다.
      - name: Install Playwright Browsers
        timeout-minutes: 18
        run: |
          cd apps/portfolio

          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = 'true' ]; then
            INSTALL_CMD='pnpm exec playwright install-deps chromium webkit'
          else
            INSTALL_CMD='pnpm exec playwright install --with-deps chromium webkit'
          fi

          for attempt in 1 2 3; do
            echo "::group::Playwright 설치 시도 ${attempt}/3"
            if timeout 5m ${INSTALL_CMD}; then
              echo '::endgroup::'
              exit 0
            fi
            echo '::endgroup::'
            echo "::warning::설치 시도 ${attempt}회차 실패(정체 또는 오류). 재시도합니다."
            sleep 15
          done

          echo '::error::Playwright 설치가 3회 모두 실패했습니다.'
          exit 1

      - name: Build Portfolio App
        run: pnpm run build --filter portfolio

      - name: Update Snapshots
        run: |
          cd apps/portfolio
          pnpm run test:e2e:update

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "test: 🤖 Update visual snapshots from CI (Ubuntu)"
          branch: ${{ steps.branch.outputs.target }}
          file_pattern: "apps/portfolio/e2e/snapshot.spec.ts-snapshots/*"
