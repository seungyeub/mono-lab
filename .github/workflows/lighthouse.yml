name: Lighthouse CI

on:
  pull_request:
    branches: ['master', 'develop']
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Run Lighthouse & PR Comment
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write # PR 댓글 작성을 위해 권한 필요

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-lighthouse-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-lighthouse-

      - name: Build Portfolio App
        run: pnpm run build --filter portfolio

      - name: Run Lighthouse CI
        run: |
          cd apps/portfolio
          pnpm exec lhci autorun --config=./.lighthouserc.cjs

      - name: Upload Lighthouse reports
        # 검증이 실패해도 리포트는 남긴다 — 점수가 낮은 원인(코드인지 러너인지)을 사후에 볼 수 있어야 한다
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-reports-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: apps/portfolio/.lighthouseci
          retention-days: 14
          if-no-files-found: warn

      - name: Parse Lighthouse Report and Add PR Comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        if: always() # Lighthouse 검증이 실패하더라도 점수를 확인할 수 있도록 항상 실행
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = './apps/portfolio/.lighthouseci';
            const manifestPath = path.join(dir, 'manifest.json');

            if (!fs.existsSync(manifestPath)) {
              core.warning('manifest.json이 없다 — upload.target이 filesystem인지 확인');
              return;
            }

            let manifest;
            try {
              manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            } catch (error) {
              core.warning(`manifest.json 파싱 실패: ${error.message}`);
              return;
            }
            if (!Array.isArray(manifest) || manifest.length === 0) {
              core.warning('manifest.json이 비어 있다');
              return;
            }

            // 3회 실행 중 lhci가 고른 대표 실행(중앙값). 없으면 첫 항목
            const result = manifest.find((m) => m.isRepresentativeRun) ?? manifest[0];
            const pct = (v) => (typeof v === 'number' ? Math.round(v * 100) : '-');
            const summary = result.summary || {};

            // 대표 실행의 전체 리포트에서 관측값과 러너 지표를 꺼낸다.
            // 시뮬레이션 LCP와 관측 LCP의 차이, benchmarkIndex(러너 CPU 속도)를 같이 보여야
            // 점수가 낮은 이유가 코드인지 러너인지 댓글만으로 구분된다
            let extra = '';
            try {
              const lhr = JSON.parse(fs.readFileSync(result.jsonPath, 'utf8'));
              const m = lhr.audits?.metrics?.details?.items?.[0] ?? {};
              const ms = (v) => (typeof v === 'number' ? `${Math.round(v)} ms` : '-');
              extra = [
                '',
                '| Metric | Simulated | Observed |',
                '| --- | --- | --- |',
                `| LCP | ${ms(m.largestContentfulPaint)} | ${ms(m.observedLargestContentfulPaint)} |`,
                `| FCP | ${ms(m.firstContentfulPaint)} | ${ms(m.observedFirstContentfulPaint)} |`,
                `| TBT | ${ms(m.totalBlockingTime)} | - |`,
                '',
                `*Runner benchmarkIndex: \`${lhr.environment?.benchmarkIndex ?? '-'}\`* (로컬 M-시리즈 약 3000 · 낮을수록 느린 러너) · runs: ${manifest.length}, median`,
              ].join('\n');
            } catch (error) {
              core.warning(`리포트 상세 읽기 실패: ${error.message}`);
            }

            const marker = '<!-- lighthouse-report -->';
            const commentBody = [
              marker,
              '## ⚡️ Lighthouse Report',
              '| Category | Score |',
              '| --- | --- |',
              `| 🚀 Performance | ${pct(summary.performance)} |`,
              `| ♿ Accessibility | ${pct(summary.accessibility)} |`,
              `| 💡 Best Practices | ${pct(summary['best-practices'])} |`,
              `| 🔎 SEO | ${pct(summary.seo)} |`,
              extra,
              '',
              `*Tested on: \`${result.url}\`* · 상세 리포트는 이 실행의 Artifacts(\`lighthouse-reports-*\`)`,
            ].join('\n');

            /*
              푸시할 때마다 댓글을 쌓지 않는다 — 표식이 있는 기존 댓글을 찾아 갱신.
              한 페이지만 읽으면 댓글이 100개를 넘는 PR에서 기존 댓글을 놓쳐 중복이 생기고,
              표식만 보면 같은 문자열을 인용한 사람의 댓글을 덮어쓸 수 있다.
              전체 페이지를 훑고 작성자가 이 워크플로의 봇인지까지 확인한다.
            */
            const comments = await github.paginate(github.rest.issues.listComments, {
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody,
              });
            }
