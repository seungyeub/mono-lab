name: Playwright Tests

on:
  pull_request:
    branches: ['master', 'develop']
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run Visual Snapshot Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-playwright-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-playwright-

      # 캐시 키를 Playwright 해석 버전에 고정한다.
      # pnpm-lock.yaml 해시를 쓰면 무관한 의존성 변경마다 400MB를 다시 받게 된다.
      - name: Get Playwright version
        id: playwright-version
        run: |
          cd apps/portfolio
          echo "VERSION=$(node -p "require('@playwright/test/package.json').version")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.VERSION }}

      # playwright.config.ts의 projects가 Desktop Chrome(chromium)과
      # Mobile Safari 2종(webkit)뿐이므로 firefox는 설치하지 않는다.
      # 캐시가 적중해도 OS 라이브러리(apt)는 캐시 대상이 아니라 매번 설치해야 한다.
      - name: Install Playwright Browsers
        timeout-minutes: 10
        run: |
          cd apps/portfolio
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium webkit
          else
            pnpm exec playwright install --with-deps chromium webkit
          fi

      - name: Build Portfolio App
        run: pnpm run build --filter portfolio

      - name: Run Playwright Tests
        run: |
          cd apps/portfolio
          pnpm exec playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always() # 실패했을 때 차이점(Diff) 이미지를 확인할 수 있도록 항상 업로드
        with:
          name: playwright-report
          path: apps/portfolio/playwright-report/
          retention-days: 14
