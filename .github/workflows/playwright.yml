name: Playwright Tests

on:
  pull_request:
    branches: ['master', 'develop']
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run Visual Snapshot Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-playwright-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-playwright-

      # 캐시 키를 Playwright 해석 버전에 고정한다.
      # pnpm-lock.yaml 해시를 쓰면 무관한 의존성 변경마다 400MB를 다시 받게 된다.
      - name: Get Playwright version
        id: playwright-version
        run: |
          cd apps/portfolio
          echo "VERSION=$(node -p "require('@playwright/test/package.json').version")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.VERSION }}

      # playwright.config.ts의 projects가 Desktop Chrome(chromium)과
      # Mobile Safari 2종(webkit)뿐이므로 firefox는 설치하지 않는다.
      #
      # 캐시가 적중해도 OS 라이브러리(apt)는 캐시 대상이 아니라 매번 설치해야 하는데,
      # 이 apt 다운로드(181개 패키지·114MB)가 Azure 미러 상태에 따라 간헐적으로 정체된다.
      # 일시적 정체이므로 5분 타임아웃 × 3회 재시도로 흡수한다.
      - name: Install Playwright Browsers
        timeout-minutes: 18
        run: |
          cd apps/portfolio

          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = 'true' ]; then
            INSTALL_CMD='pnpm exec playwright install-deps chromium webkit'
          else
            INSTALL_CMD='pnpm exec playwright install --with-deps chromium webkit'
          fi

          for attempt in 1 2 3; do
            echo "::group::Playwright 설치 시도 ${attempt}/3"
            if timeout --kill-after=30s 5m ${INSTALL_CMD}; then
              echo '::endgroup::'
              exit 0
            fi
            echo '::endgroup::'
            echo "::warning::설치 시도 ${attempt}회차 실패(정체 또는 오류). 재시도합니다."
            # --kill-after의 SIGKILL은 apt-get을 트랜잭션 도중 죽여 dpkg 잠금을 놓지 못하게 만들 수 있다.
            # 다음 시도가 "Could not get lock"으로 즉시 실패하지 않도록 잠금과 잔여 프로세스를 정리한다.
            sudo pkill -9 -f 'apt-get|dpkg' > /dev/null 2>&1 || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock
            sudo dpkg --configure -a > /dev/null 2>&1 || true
            sleep 15
          done

          echo '::error::Playwright 설치가 3회 모두 실패했습니다.'
          exit 1

      - name: Build Portfolio App
        run: pnpm run build --filter portfolio

      - name: Run Playwright Tests
        run: |
          cd apps/portfolio
          pnpm exec playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always() # 실패했을 때 차이점(Diff) 이미지를 확인할 수 있도록 항상 업로드
        with:
          name: playwright-report
          path: apps/portfolio/playwright-report/
          retention-days: 14
